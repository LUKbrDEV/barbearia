<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<script>
  // GitHub Pages publica em /NOME-DO-REPO/. Se o seu repositório tiver outro nome, troque aqui (e no 404.html).
  (function () { var REPO = "barbearia", p = location.pathname.split("/")[1];
    window.BASE = location.hostname.endsWith(".github.io") && p === REPO ? "/" + REPO + "/" : "/";
    document.write('<base href="' + window.BASE + '">'); })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agenda Barber</title>
<meta name="description" content="Agenda online para barbearias: o cliente marca em segundos, o barbeiro organiza o dia.">
<meta name="theme-color" content="#16181d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Agenda Barber">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top" id="topo"></header>
<main id="app" tabindex="-1"></main>
<footer class="rodape" id="rodape"></footer>
<nav class="tabbar" id="tabbar" aria-label="Navegação" hidden></nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="modal" id="modal" hidden><div class="modal-box" id="modalBox" role="dialog" aria-modal="true"></div></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="poste" viewBox="0 0 24 24"><rect x="8" y="3" width="8" height="18" rx="4" fill="#fff"/><path d="M8 9l8-4v3l-8 4zM8 15l8-4v3l-8 4z" fill="#c8102e"/><path d="M8 12l8-4v1.5l-8 4z" fill="#1b3a6b"/><rect x="6.5" y="2" width="11" height="2.5" rx="1.2" fill="#cfd3da"/><rect x="6.5" y="19.5" width="11" height="2.5" rx="1.2" fill="#cfd3da"/></symbol>
  <symbol id="posteGrande" viewBox="0 0 120 300">
    <defs>
      <clipPath id="clipPoste"><rect x="30" y="40" width="60" height="220" rx="30"/></clipPath>
      <pattern id="listras" width="60" height="96" patternUnits="userSpaceOnUse" patternTransform="skewY(-32)">
        <rect width="60" height="96" fill="#fff"/><rect y="0" width="60" height="24" fill="#c8102e"/><rect y="48" width="60" height="24" fill="#1b3a6b"/>
        <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="0 96" dur="3.2s" repeatCount="indefinite" additive="sum"/>
      </pattern>
      <linearGradient id="brilho" x1="0" x2="1"><stop offset="0" stop-color="#000" stop-opacity=".28"/><stop offset=".35" stop-color="#fff" stop-opacity=".35"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".35"/></linearGradient>
      <linearGradient id="metal" x1="0" x2="1"><stop offset="0" stop-color="#8b919c"/><stop offset=".4" stop-color="#eef0f4"/><stop offset="1" stop-color="#6c727d"/></linearGradient>
    </defs>
    <ellipse cx="60" cy="290" rx="44" ry="7" fill="#000" opacity=".25"/>
    <rect x="30" y="40" width="60" height="220" fill="url(#listras)" clip-path="url(#clipPoste)"/>
    <rect x="30" y="40" width="60" height="220" rx="30" fill="url(#brilho)"/>
    <rect x="22" y="22" width="76" height="22" rx="11" fill="url(#metal)"/>
    <circle cx="60" cy="14" r="12" fill="url(#metal)"/>
    <rect x="22" y="256" width="76" height="22" rx="11" fill="url(#metal)"/>
  </symbol>
</svg>

<script src="js/config.js"></script>
<script src="js/agenda.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
<script src="js/landing.js"></script>
<script src="js/cliente.js"></script>
<script src="js/painel.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
